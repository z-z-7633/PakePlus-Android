<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间管理工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4A90E2;
            --primary-light: #6BA3E8;
            --primary-dark: #3A7BC8;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-primary: #333333;
            --text-secondary: #666666;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 4px 20px rgba(74, 144, 226, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 侧滑抽屉菜单 */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--card-bg);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .drawer.active {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .drawer-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .drawer-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .drawer-close:hover {
            background: var(--primary-color);
            color: white;
        }

        .drawer-section {
            margin-bottom: 25px;
        }

        .drawer-section-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .drawer-item label {
            font-size: 14px;
            color: var(--text-primary);
        }

        /* 主容器 */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* 顶部导航 */
        .menu-btn {
            display: none;
        }

        /* 左侧抽屉图标标签 */
        .drawer-tab {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 78px;
            background: var(--primary-color);
            border-radius: 0 14px 14px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: grab;
            touch-action: none;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
            transition: width 0.3s ease, background 0.3s ease, top 0.1s linear;
        }

        .drawer-tab.dragging {
            cursor: grabbing;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .drawer-tab:active {
            width: 32px;
        }

        .drawer-tab i {
            color: white;
            font-size: 13px;
        }

        /* 左侧边缘触发区域 */
        .edge-trigger {
            position: fixed;
            left: 0;
            top: 0;
            width: 26px;
            height: 100%;
            z-index: 98;
            cursor: pointer;
        }

        /* 内容区域 */
        .content {
            padding: 0 20px;
        }

        .tab-content {
            display: none;
            min-height: calc(100vh - 140px);
            padding-top: 20px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* 时间模块 */
        .time-display {
            text-align: center;
        }

        .current-time {
            font-size: 56px;
            font-weight: 300;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .current-date {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .time-info {
            display: flex;
            justify-content: space-around;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 计时器模块 */
        .timer-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .timer-time {
            font-size: 56px;
            font-weight: 300;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .timer-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .timer-input-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .timer-input-group label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 0;
            order: 2;
        }

        .timer-input {
            width: 70px;
            height: 50px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .timer-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .timer-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* 常用倒计时设置 */
        .card.preset-card {
            margin-top: 20px;
        }

        .preset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .preset-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 16px;
            gap: 5px;
            box-shadow: none;
        }

        .btn-sm i {
            font-size: 11px;
        }

        .btn-outline {
            background: rgba(74, 144, 226, 0.08);
            border: 1px solid rgba(74, 144, 226, 0.4);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-danger-outline {
            border: 1.5px solid #e74c3c;
            color: #e74c3c;
        }

        .btn-danger-outline:hover {
            background: #e74c3c;
            color: white;
        }

        .preset-list {
            max-height: 260px;
            overflow-y: auto;
        }

        .preset-empty {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            padding: 20px 0;
        }

        .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .preset-item:hover {
            background: #eef2f7;
        }

        .preset-item[draggable="true"] {
            cursor: grab;
        }

        .preset-item[draggable="true"]:active {
            cursor: grabbing;
        }

        .preset-item.dragging {
            opacity: 0.45;
        }

        .preset-item.drag-over {
            box-shadow: inset 0 0 0 2px var(--primary-color);
            background: #eef6ff;
        }

        .preset-grip {
            color: #bbb;
        }

        .preset-grip:hover {
            background: transparent;
            color: #999;
            cursor: grab;
        }

        .preset-item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .preset-item-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preset-item-time {
            font-size: 13px;
            color: var(--primary-color);
            margin-top: 3px;
            font-family: 'Courier New', monospace;
        }

        .preset-item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .preset-action-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .preset-action-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .preset-action-btn.danger:hover {
            background: #e74c3c;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        /* 番茄钟模块 */
        .pomodoro-container {
            text-align: center;
        }

        .pomodoro-circle {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
        }

        .pomodoro-progress {
            width: 100%;
            height: 100%;
        }

        .pomodoro-progress circle {
            fill: none;
            stroke-width: 10;
        }

        .pomodoro-progress .bg {
            stroke: #e0e0e0;
        }

        .pomodoro-progress .progress {
            stroke: var(--primary-color);
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 1s linear;
        }

        .pomodoro-time {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px;
            font-weight: 300;
            color: var(--primary-color);
        }

        .pomodoro-status {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            padding: 8px 20px;
            background: var(--primary-light);
            color: white;
            border-radius: 20px;
            display: inline-block;
        }

        .pomodoro-count {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .pomodoro-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: all 0.3s;
        }

        .pomodoro-dot.completed {
            background: var(--primary-color);
        }

        /* 日程模块 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .calendar-nav-btn:hover {
            background: var(--primary-dark);
        }

        .calendar-month {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .calendar-day-name {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 10px 0;
            font-weight: 500;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .calendar-day:hover {
            background: var(--primary-light);
            color: white;
        }

        .calendar-day.today {
            background: var(--primary-color);
            color: white;
        }

        .calendar-day.selected {
            background: var(--primary-light);
            color: white;
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .schedule-list {
            margin-top: 20px;
        }

        .schedule-list-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
        }

        .schedule-info {
            flex: 1;
        }

        .schedule-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .schedule-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .schedule-actions {
            display: flex;
            gap: 8px;
        }

        .schedule-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .schedule-action-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .add-schedule-btn {
            width: 100%;
            padding: 15px;
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            background: transparent;
            color: var(--primary-color);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-schedule-btn:hover {
            background: var(--primary-color);
            color: white;
            border-style: solid;
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        .nav-items {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: transparent;
        }

        .nav-item:hover {
            transform: translateY(-2px);
        }

        .nav-icon {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            transition: all 0.3s;
        }

        .nav-label {
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            color: var(--primary-color);
        }

        .nav-item.active .nav-label {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: all 0.3s;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--primary-color);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        /* 常用倒计时弹窗 */
        .preset-time-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 弹窗内时/分/秒输入框高度与其他筛选器(.form-input)保持一致 */
        #presetModal .timer-input {
            width: 54px;
            height: 42px;
            font-size: 15px;
            padding: 0;
        }

        .confirm-text {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 24px;
            text-align: center;
        }

        .confirm-actions {
            display: flex;
            gap: 15px;
        }

        .confirm-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 1002;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        /* 开关样式 */
        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* 时间页面：白色卡片铺满可用区域（仅影响时间页面） */
        #timeTab.active {
            justify-content: stretch;
        }
        #timeTab.active .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        #timeTab.active .card {
            flex: 1;
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #timeTab.active .time-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 农历日期 */
        .lunar-date {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: -12px;
            margin-bottom: 20px;
        }

        /* 抽屉中的下拉选择 */
        .drawer-select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
        }
        .drawer-select:focus {
            border-color: var(--primary-color);
        }

        /* 悬浮时间框 */
        .floating-box {
            position: fixed;
            top: 80px;
            right: 20px;

        // 时间模块
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            // 12小时制时转换并添加上午/下午标识
            let period = '';
            if (!settings.timeFormat24) {
                period = hours >= 12 ? '下午' : '上午';
                hours = hours % 12 || 12;
            }
            const hoursStr = String(hours).padStart(2, '0');

            // 显示毫秒时格式为 HH:MM:SS.mmm，否则为 HH:MM:SS
            let timeDisplay;
            if (settings.showMilliseconds) {
                const ms = String(now.getMilliseconds()).padStart(3, '0');
                timeDisplay = `${period}${hoursStr}:${minutes}:${seconds}.${ms}`;
            } else {
                timeDisplay = `${period}${hoursStr}:${minutes}:${seconds}`;
            }

            document.getElementById('currentTime').textContent = timeDisplay;

            // 同步更新悬浮框时间
            const floatingEl = document.getElementById('floatingTime');
            if (floatingEl) floatingEl.textContent = timeDisplay;

            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

            const dateStr = `${now.getFullYear()}年${months[now.getMonth()]}${now.getDate()}日 ${days[now.getDay()]}`;
            document.getElementById('currentDate').textContent = dateStr;

            // 农历日期
            document.getElementById('lunarDate').textContent = getLunarString(now);

            // 周数计算
            const startOfYear = new Date(now.getFullYear(), 0, 1);
            const days2 = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000));
            const weekNumber = Math.ceil((days2 + startOfYear.getDay() + 1) / 7);
            document.getElementById('weekNumber').textContent = weekNumber;

            // 今年已过天数
            const daysPassed = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000)) + 1;
            document.getElementById('daysPassed').textContent = `${daysPassed}天`;

            // 年进度
            const yearProgress = ((daysPassed / 365) * 100).toFixed(1);
            document.getElementById('yearProgress').textContent = `${yearProgress}%`;
        }

            0x05170,0x082b0,0x0a930,0x0b552,0x04ad0,0x0a5d0,0x0b350,0x05170,0x0a9a0,0x0b550,

        function lunarYearDays(y) {
            let sum = 348;
            for (let i = 0x8000; i > 0x8; i >>= 1) {
                sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
            }
            return sum + leapDays(y);
        }

        function leapMonth(y) {
            return lunarInfo[y - 1900] & 0xf;
        }

        function leapDays(y) {
            if (leapMonth(y)) {
                return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
            }
            return 0;
        }

        function monthDays(y, m) {
            return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
        }

        function solarToLunar(date) {
            let offset = Math.floor((date - new Date(1900, 0, 31)) / 86400000);
            let temp = 0, i;
            let lunarYear, lunarMonth, lunarDay, isLeap = false;

            for (i = 1900; i < 2101 && offset > 0; i++) {
                temp = lunarYearDays(i);
                offset -= temp;
            }
            if (offset < 0) {
                offset += temp;
                i--;
            }
            lunarYear = i;

            const leap = leapMonth(lunarYear);
            isLeap = false;

            for (i = 1; i < 13 && offset > 0; i++) {
                if (leap > 0 && i === (leap + 1) && !isLeap) {
                    --i;
                    isLeap = true;
                    temp = leapDays(lunarYear);
                } else {
                    temp = monthDays(lunarYear, i);
                }
                if (isLeap && i === (leap + 1)) isLeap = false;
                offset -= temp;
            }
            if (offset === 0 && leap > 0 && i === leap + 1) {
                if (isLeap) {
                    isLeap = false;
                } else {
                    isLeap = true;
                    --i;
                }
            }
            if (offset < 0) {
                offset += temp;
                --i;
            }
            lunarMonth = i;
            lunarDay = offset + 1;

            return { year: lunarYear, month: lunarMonth, day: lunarDay, isLeap: isLeap };
        }

        function getLunarString(date) {
            try {
                const lunar = solarToLunar(date);
                const monthNames = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
                const dayNames = [
                    '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                    '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                    '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'
                ];
                const monthStr = (lunar.isLeap ? '闰' : '') + monthNames[lunar.month - 1] + '月';
                const dayStr = dayNames[lunar.day - 1] || '';
                return `农历${monthStr}${dayStr}`;
            } catch (e) {
                return '';
            }
        }

        function makeFloatingDraggable(box) {
            let isDragging = false;
            let offsetX = 0, offsetY = 0;
            let longPressTimer = null;
            let longPressTriggered = false;
            const LONG_PRESS_MS = 800;

            const startLongPress = () => {
                clearLongPress();
                longPressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    isDragging = false;
                    closeFloating();
                }, LONG_PRESS_MS);
            };
            const clearLongPress = () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            };

            const startDrag = (clientX, clientY) => {
                const rect = box.getBoundingClientRect();
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
                isDragging = true;
                box.style.cursor = 'grabbing';
            };
            const doDrag = (clientX, clientY) => {
                if (!isDragging) return;
                // 拖动时取消长按
                clearLongPress();
                let newX = clientX - offsetX;
                let newY = clientY - offsetY;
                const maxX = window.innerWidth - box.offsetWidth;
                const maxY = window.innerHeight - box.offsetHeight;
                newX = Math.max(0, Math.min(maxX, newX));
                newY = Math.max(0, Math.min(maxY, newY));
                box.style.left = newX + 'px';
                box.style.top = newY + 'px';
                box.style.right = 'auto';
            };
            const endDrag = () => {
                clearLongPress();
                if (isDragging) {
                    isDragging = false;
                    box.style.cursor = 'move';
                }
            };

            box.addEventListener('mousedown', (e) => {
                longPressTriggered = false;
                startLongPress();
                startDrag(e.clientX, e.clientY);
            });
            document.addEventListener('mousemove', (e) => doDrag(e.clientX, e.clientY));
            document.addEventListener('mouseup', endDrag);

            box.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                longPressTriggered = false;
                startLongPress();
                startDrag(t.clientX, t.clientY);
            }, { passive: true });
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const t = e.touches[0];
                doDrag(t.clientX, t.clientY);
            }, { passive: true });
            document.addEventListener('touchend', endDrag);
        }

        // 计时器模块

        function startTimer() {
            if (!timerRunning) {
                if (timerSeconds === 0) {
                    const hours = parseInt(document.getElementById('timerHours').value) || 0;
                    const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
                    const seconds = parseInt(document.getElementById('timerSeconds').value) || 0;
                    timerSeconds = hours * 3600 + minutes * 60 + seconds;
                    timerTotal = timerSeconds;
                }

                if (timerSeconds > 0) {
                    timerRunning = true;
                    document.getElementById('timerInputs').style.display = 'none';
                    updateTimerButton(true);
                    timerInterval = setInterval(updateTimer, 1000);
                } else {
                    showToast('请设置倒计时时间');

            }
        }

        function pauseTimer() {
            timerRunning = false;

            document.getElementById('timerInputs').style.display = 'flex';
            document.getElementById('timerDisplay').textContent = '00:00:00';
            updateTimerButton(false);

        function updateTimer() {
            if (timerSeconds > 0) {
                timerSeconds--;
                if (settings.timerTickingSound) {
                    playTickSound();
                }
                const hours = Math.floor(timerSeconds / 3600);
                const minutes = Math.floor((timerSeconds % 3600) / 60);
                const seconds = timerSeconds % 60;
                document.getElementById('timerDisplay').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                if (settings.timerLoop && timerTotal > 0) {
                    // 循环模式：重新开始计时
                    timerSeconds = timerTotal;
                    const h = Math.floor(timerSeconds / 3600);
                    const m = Math.floor((timerSeconds % 3600) / 60);
                    const s = timerSeconds % 60;
                    document.getElementById('timerDisplay').textContent = 
                        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    return;
                }
                timerRunning = false;
                clearInterval(timerInterval);
                updateTimerButton(false);
                showToast('倒计时结束！');
                if (settings.timerSound) {
                    playSound();
                }
                sendNotification('计时器', '倒计时已结束！');
            }

        // 拖拽排序
        let dragPresetId = null;

        function presetDragStart(e) {
            dragPresetId = e.currentTarget.dataset.id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragPresetId);
            requestAnimationFrame(() => e.currentTarget.classList.add('dragging'));
        }

        function presetDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function presetDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function presetDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const fromId = dragPresetId;
            const toId = e.currentTarget.dataset.id;
            if (!fromId || fromId === toId) return;
            const fromIdx = timerPresets.findIndex(p => p.id === fromId);
            const toIdx = timerPresets.findIndex(p => p.id === toId);
            if (fromIdx < 0 || toIdx < 0) return;
            const [moved] = timerPresets.splice(fromIdx, 1);
            timerPresets.splice(toIdx, 0, moved);
            saveTimerPresets();
        }

        function presetDragEnd() {
            dragPresetId = null;
            document.querySelectorAll('#timerPresetList .preset-item').forEach(el => {
                el.classList.remove('dragging', 'drag-over');

        // 保存/编辑弹窗确认
        function confirmPresetModal() {
            const name = document.getElementById('presetNameInput').value.trim();
            const loop = document.getElementById('presetLoop').value === '1';
            const reminder = document.getElementById('presetReminder').value === '1';
            const ticking = document.getElementById('presetTicking').value === '1';
            if (!name) {
                showToast('名称不能为空');
                return;
            }
            if (presetModalMode === 'save') {
                const hours = parseInt(document.getElementById('timerHours').value) || 0;
                const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
                const seconds = parseInt(document.getElementById('timerSeconds').value) || 0;
                timerPresets.push({ id: 'p' + Date.now(), name, hours, minutes, seconds, loop, reminder, ticking });
                closePresetModal();
                saveTimerPresets();
                showToast('已保存常用设置');
            } else {
                const preset = timerPresets.find(p => p.id === presetEditingId);
                if (!preset) {
                    closePresetModal();

                const h = parseInt(document.getElementById('presetEditHours').value) || 0;
                const m = parseInt(document.getElementById('presetEditMinutes').value) || 0;
                const s = parseInt(document.getElementById('presetEditSeconds').value) || 0;

                preset.hours = h;
                preset.minutes = m;
                preset.seconds = s;
                preset.loop = loop;
                preset.reminder = reminder;
                preset.ticking = ticking;
                closePresetModal();
                saveTimerPresets();
                showToast('已更新常用设置');

        // 快速调用：将预设填充到输入框，若设置了时长则自动开始

            const preset = timerPresets.find(p => p.id === id);
            if (!preset) return;
            // 若正在倒计时，先重置
            if (timerRunning) {
                resetTimer();
            }
            // 应用当前预设的循环与提醒设置
            settings.timerLoop = !!preset.loop;
            settings.timerSound = preset.reminder === undefined ? true : !!preset.reminder;
            settings.timerTickingSound = !!preset.ticking;
            document.getElementById('timerHours').value = preset.hours;
            document.getElementById('timerMinutes').value = preset.minutes;
            document.getElementById('timerSeconds').value = preset.seconds;
            document.getElementById('timerDisplay').textContent = formatPresetTime(preset.hours, preset.minutes, preset.seconds);
            startTimer();
            showToast(`已调用「${preset.name}」`);

            if (pomodoroSeconds > 0) {

                document.getElementById('pomodoroTime').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                const totalSeconds = isWorking ? pomodoroWorkTime * 60 : pomodoroBreakTime * 60;
                const progress = ((totalSeconds - pomodoroSeconds) / totalSeconds) * 283;
                updatePomodoroProgress(progress);
            } else {
                pomodoroRunning = false;
                clearInterval(pomodoroInterval);
                
                if (isWorking) {
                    pomodoroCompletedCount++;
                    updatePomodoroDots();
                    showToast('工作时间结束，开始休息！');
                    sendNotification('番茄钟', '工作时间结束，开始休息！');

                    pomodoroSeconds = pomodoroWorkTime * 60;

        // 日程模块
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const days = ['日', '一', '二', '三', '四', '五', '六'];
            days.forEach(day => {
                grid.innerHTML += `<div class="calendar-day-name">${day}</div>`;
            });

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('calendarMonth').textContent = `${year}年${months[month]}`;

            // 上月日期
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                grid.innerHTML += `<div class="calendar-day other-month">${day}</div>`;
            }

            // 本月日期
            const today = new Date();
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === i;
                const isSelected = selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === i;
                const hasEvent = schedules[dateStr] && schedules[dateStr].length > 0;
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isSelected && !isToday) classes += ' selected';
                if (hasEvent) classes += ' has-event';

                grid.innerHTML += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${i})">${i}</div>`;
            }

            // 下月日期
            const totalCells = 42;
            const filledCells = firstDay + daysInMonth;
            const remainingCells = totalCells - filledCells;
            for (let i = 1; i <= remainingCells; i++) {
                grid.innerHTML += `<div class="calendar-day other-month">${i}</div>`;
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);

        }

        function closeScheduleModal() {
            document.getElementById('scheduleModal').classList.remove('active');
        }

        function saveSchedule() {
            const title = document.getElementById('scheduleTitle').value.trim();
            const time = document.getElementById('scheduleTime').value;
            const reminder = parseInt(document.getElementById('scheduleReminder').value);

            if (!title) {
                showToast('请输入日程标题');
                return;
            }

            if (!time) {
                showToast('请选择时间');
                return;
            }

            const dateStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}-${String(selectedDate.getDate()).padStart(2, '0')}`;
            
            if (!schedules[dateStr]) {
                schedules[dateStr] = [];
            }

            schedules[dateStr].push({
                title,
                time,
                reminder,
                notified: false
            });

            schedules[dateStr].sort((a, b) => a.time.localeCompare(b.time));

            localStorage.setItem('schedules', JSON.stringify(schedules));
            renderCalendar();
            renderScheduleList();
            closeScheduleModal();
            showToast('日程添加成功');
        }

        function deleteSchedule(dateStr, index) {
            schedules[dateStr].splice(index, 1);
            if (schedules[dateStr].length === 0) {
                delete schedules[dateStr];
            }
            localStorage.setItem('schedules', JSON.stringify(schedules));
            renderCalendar();
            renderScheduleList();
            showToast('日程已删除');
        }

        // 侧滑抽屉菜单
        function openDrawer(type) {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawerOverlay');
            const content = document.getElementById('drawerContent');
            const title = document.getElementById('drawerTitle');

            let drawerContent = '';

            switch(type) {
                case 'time':
                    title.textContent = '时间设置';
                    drawerContent = `
                        <div class="drawer-section">
                            <div class="drawer-section-title">显示设置</div>
                            <div class="drawer-item">
                                <label>24小时制</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.timeFormat24 ? 'checked' : ''} onchange="toggleSetting('timeFormat24')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="drawer-item">
                                <label>显示毫秒</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.showMilliseconds ? 'checked' : ''} onchange="toggleSetting('showMilliseconds')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="drawer-section">
                            <div class="drawer-section-title">悬浮显示</div>
                            <div class="drawer-item">
                                <label>悬浮显示</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.floatingEnabled ? 'checked' : ''} onchange="toggleSetting('floatingEnabled')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="drawer-item">
                                <label>悬浮框大小</label>
                                <select class="drawer-select" onchange="updateFloatingSize(this.value)">
                                    <option value="small" ${settings.floatingSize === 'small' ? 'selected' : ''}>小</option>
                                    <option value="medium" ${(settings.floatingSize === 'medium' || !settings.floatingSize) ? 'selected' : ''}>中</option>
                                    <option value="large" ${settings.floatingSize === 'large' ? 'selected' : ''}>大</option>
                                </select>
                            </div>
                        </div>
                    `;
                    break;

                case 'timer':
                    title.textContent = '计时器设置';
                    drawerContent = `
                        <div class="drawer-section">
                            <div class="drawer-section-title">循环设置</div>
                            <div class="drawer-item">
                                <label>循环计时</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.timerLoop ? 'checked' : ''} onchange="toggleSetting('timerLoop')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="drawer-section">
                            <div class="drawer-section-title">提醒设置</div>
                            <div class="drawer-item">
                                <label>计时结束提示音</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.timerSound ? 'checked' : ''} onchange="toggleSetting('timerSound')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="drawer-item">
                                <label>每秒滴答声</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.timerTickingSound ? 'checked' : ''} onchange="toggleSetting('timerTickingSound')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    `;
                    break;

                case 'pomodoro':
                    title.textContent = '番茄钟设置';
                    drawerContent = `
                        <div class="drawer-section">
                            <div class="drawer-section-title">时间设置</div>
                            <div class="drawer-item">
                                <label>工作时间（分钟）</label>
                                <input type="number" class="timer-input" value="${settings.pomodoroWorkTime}" min="1" max="60" onchange="updatePomodoroSetting('work', this.value)">
                            </div>
                            <div class="drawer-item">
                                <label>休息时间（分钟）</label>
                                <input type="number" class="timer-input" value="${settings.pomodoroBreakTime}" min="1" max="30" onchange="updatePomodoroSetting('break', this.value)">
                            </div>
                        </div>
                        <div class="drawer-section">
                            <div class="drawer-section-title">提醒设置</div>
                            <div class="drawer-item">
                                <label>提示音</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.timerSound ? 'checked' : ''} onchange="toggleSetting('timerSound')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    `;
                    break;

                case 'schedule':
                    title.textContent = '日程设置';
                    drawerContent = `
                        <div class="drawer-section">
                            <div class="drawer-section-title">提醒设置</div>
                            <div class="drawer-item">
                                <label>日程提醒</label>
                                <label class="switch">
                                    <input type="checkbox" ${settings.scheduleNotification ? 'checked' : ''} onchange="toggleSetting('scheduleNotification')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    `;
                    break;
            }

            content.innerHTML = drawerContent;
            drawer.classList.add('active');
            overlay.classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('active');
            document.getElementById('drawerOverlay').classList.remove('active');
        }

        document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

        // 侧滑抽屉图标上下拖动
        (function initDrawerTabDrag() {
            const tab = document.getElementById('drawerTab');
            if (!tab) return;

            // 恢复上次保存的位置
            if (settings.drawerTabTop != null) {
                const maxTop = window.innerHeight - tab.offsetHeight;
                const top = Math.min(settings.drawerTabTop, maxTop);
                tab.style.top = top + 'px';
                tab.style.transform = 'none';
            }

            let isDragging = false;
            let startY = 0;
            let startTop = 0;

            const onMove = (e) => {
                if (!isDragging) return;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dy = clientY - startY;
                const maxTop = window.innerHeight - tab.offsetHeight;
                let newTop = Math.max(0, Math.min(startTop + dy, maxTop));
                tab.style.top = newTop + 'px';
                tab.style.transform = 'none';
                settings.drawerTabTop = newTop;
            };

            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                tab.classList.remove('dragging');
                localStorage.setItem('settings', JSON.stringify(settings));
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            };

            const onStart = (e) => {
                // 点击打开抽屉走 onclick，拖动才拦截
                isDragging = true;
                startY = e.touches ? e.touches[0].clientY : e.clientY;
                startTop = tab.offsetTop;
                tab.classList.add('dragging');
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
                if (e.preventDefault) e.preventDefault();
            };

            tab.addEventListener('mousedown', onStart);
            tab.addEventListener('touchstart', onStart, { passive: false });

            // 点击（无拖动）时打开抽屉
            tab.addEventListener('click', function() {
                if (!draggingOccurred) {
                    openDrawer(getCurrentModule());
                }
                draggingOccurred = false;
            });

            let draggingOccurred = false;
            const userMove = (e) => {
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                if (Math.abs(clientY - startY) > 5) draggingOccurred = true;
            };
            tab.addEventListener('mousemove', userMove);
            tab.addEventListener('touchmove', userMove, { passive: true });
        })();

        function toggleSetting(key) {
            settings[key] = !settings[key];
            localStorage.setItem('settings', JSON.stringify(settings));

            if (key === 'showMilliseconds') {
                // 切换毫秒显示时同步更新定时器间隔
                setupTimeUpdater();
                updateTime();
            } else if (key === 'timeFormat24') {
                // 切换24小时制后立即刷新时间显示
                updateTime();
            } else if (key === 'floatingEnabled') {
                if (settings.floatingEnabled) {
                    createFloatingBox();
                } else {
                    removeFloatingBox();
                }
            } else if (key === 'pomodoroWorkTime') {
                pomodoroWorkTime = settings.pomodoroWorkTime;
            } else if (key === 'pomodoroBreakTime') {
                pomodoroBreakTime = settings.pomodoroBreakTime;
            }
        }

        function updatePomodoroSetting(type, value) {
            value = parseInt(value);
            if (type === 'work') {
                settings.pomodoroWorkTime = value;
                pomodoroWorkTime = value;
            } else {
                settings.pomodoroBreakTime = value;
                pomodoroBreakTime = value;
            }
            localStorage.setItem('settings', JSON.stringify(settings));
        }

        // 通知功能
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function sendNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon: '⏰' });
            }
        }

        function checkNotifications() {
            setInterval(() => {
                if (!settings.scheduleNotification) return;

                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const scheduleList = schedules[dateStr] || [];
                scheduleList.forEach(schedule => {
                    if (!schedule.notified && schedule.reminder > 0) {
                        const scheduleMinutes = parseInt(schedule.time.split(':')[0]) * 60 + parseInt(schedule.time.split(':')[1]);
                        const currentMinutes = now.getHours() * 60 + now.getMinutes();
                        const diffMinutes = scheduleMinutes - currentMinutes;

                        if (diffMinutes <= schedule.reminder && diffMinutes > 0) {
                            sendNotification('日程提醒', `${schedule.title} 将在 ${diffMinutes} 分钟后开始`);
                            schedule.notified = true;
                            localStorage.setItem('schedules', JSON.stringify(schedules));
                        }
                    }
                });
            }, 60000);
        }

        // 播放提示音
        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // 播放每秒滴答声（区别于计时结束提示音）
        function playTickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 1200;
            oscillator.type = 'square';

            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.08);
        }

        // Toast提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
